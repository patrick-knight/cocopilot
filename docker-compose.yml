services:
  cocopilot-app:
    build: .
    command: ["sh", "-lc", "node dist/cli/index.js start --foreground || true; tail -f /dev/null"]
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - /var/run/docker.sock:/var/run/docker.sock
      - cocopilot-data:/root/.cocopilot
      - gh-auth:/root/.config/gh
      - copilot-config:/root/.config/github-copilot
      - npm-global:/root/.npm-global
    depends_on:
      - redis
    environment:
      - HOME=/root
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development

  redis:
    image: redis:7.4.6-alpine
    ports:
      - "6379:6379"

volumes:
  cocopilot-data:
  gh-auth:
  copilot-config:
  npm-global:
